	@title = Catch Pin Cylinder (1P4)
	@description = Telescoping catch pin: mount two, opposite, inside the upper tank; extended through the wall for the tower catch.
	%breakingForce = 1000
	%breakingTorque = 1000
	@crashTolerance = 50
	%entryCost = 0
	%cost = 0
}

