// Tower clamp: the stock TT18-A launch clamp, out of the staging and five times stronger.
// ReStock replaces the clamp's LaunchClamp module by ModuleRestockLaunchClamp, so a craft
// that disabled staging on "LaunchClamp" had it silently dropped (KSPCF: "Persisted module
// LaunchClamp ... has been removed") and the tower's clamps stayed in its staging list.
+PART[launchClamp1]:FINAL
{
	@name = TG_TowerClamp
	@title = Catch Tower Clamp
	%breakingForce = 1000
	%breakingTorque = 1000
	%entryCost = 0
	%cost = 0
	@MODULE[LaunchClamp]
	{
		%stagingEnabled = False
	}
	@MODULE[ModuleRestockLaunchClamp]
	{
		%stagingEnabled = False
	}
}

