// Parts for the booster catch tower (Terminal Guidance).
//
// Every part here is a COPY of a part already in the game (+PART), under a new name:
// the originals, existing craft, saves and other mods are left untouched, and no new
// model is shipped. Only three things change on the copies:
//
//   * breakingForce / breakingTorque. A part that does not set them gets the Part
//     default of 22. A joint breaks at min(both parts) x (node size + 1) x 2 x 50
//     (x 0.8 instead of x 2 for a surface joint; jointBreakForceFactor = 50 in
//     Physics.cfg). With 22, a hinge on a Making History tube holds 4.4 MN.m and the
//     mast foot 11 MN.m, against 11 and 22 MN.m for the heaviest booster we catch
//     (221 t dry, arms ~10 m from the pivot). With 200: 40 and 100 MN.m.
//   * crashTolerance, so a booster brushing the tower at a few m/s does not delete it.
//   * entryCost = 0, so the parts need no purchase in career once their (unchanged)
//     tech node is researched, and cost = 0 (variants included): the tower stays on its
//     site for good, so its price would never come back.
//
// Removing this file breaks every craft and vessel that uses these parts.
//
// The copies are made in the :FINAL pass, so they copy each part as every other mod left
// it. ReStock, for one, replaces the stock HubMax model and DELETES the old model.mu: a
// copy made earlier kept `mesh = model.mu` and failed to load ("No AvailablePart found
// for TG.TowerHead", 27/09/2026).

// Catch lug: the stock Cubic Octagonal Strut scaled from 0.257 m to 1.2 m. It is
// physicsless (PhysicsSignificance = 1): KSP parents it to the tank it sits on, so its
// collider belongs to the tank and the booster's weight crosses no joint. Six of them,
// 60 degrees apart, make the catch independent of the booster's roll.
+PART[strutCube]:FINAL
{
	@name = TG_CatchLug
	@title = Catch Lug (1.2 m)
	@description = Physicsless load point for catching a booster with the tower arms. Place six, 60 degrees apart, above the dry centre of mass.
	@rescaleFactor = 4.67
	@mass = 0.05
	@crashTolerance = 50
	%breakingForce = 200
	%breakingTorque = 200
	@maxTemp = 2400
	%entryCost = 0
	%cost = 0
}

// Catch pins (decision of 29/09/2026: two opposite pins and a roll-aligned booster, like
// Super Heavy, instead of six lugs): the stock M-Beam 200 I-Beam, attached end-on so it
// sticks straight out of the tank, scaled so that its tip is 3.9 m from the booster axis
// whatever the core (rails 3.02 m from the axis: 0.62 m of lateral tolerance with a 10
// degree roll error, and the tip stays clear of the arm tubes). Physicsless like the lug:
// its collider belongs to the tank, so the booster's weight crosses no joint. A thin beam
// adds far less drag than six blocks long enough to reach the rails. 5 kg each: the booster
// signature (dry mass in 500 kg buckets) should not change when they are added.
+PART[structuralIBeam2]:FINAL
{
	@name = TG_CatchPin25
	@title = Catch Pin (2.5 m core, 2.65 m)
	@description = Physicsless catch pin for a 2.5 m booster core: two of them, opposite, above the dry centre of mass. Reach 3.9 m from the booster axis.
	@rescaleFactor = 0.8290
	%PhysicsSignificance = 1
	@mass = 0.005
	@crashTolerance = 50
	@maxTemp = 2400
	%entryCost = 0
	%cost = 0
}

+PART[structuralIBeam2]:FINAL
{
	@name = TG_CatchPin375
	@title = Catch Pin (3.75 m core, 2.02 m)
