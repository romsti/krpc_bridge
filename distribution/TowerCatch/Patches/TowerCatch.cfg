// Tower head: the stock Rockomax HubMax scaled to the 5 m mast (side nodes at 2.5 m),
// heavier and stronger. Its four side nodes carry the horizontal arm mounts, so the
// arm hinges can turn about a VERTICAL axis: a hinge stacked on a vertical column
// always turns about a horizontal one. Node sizes are raised so the joints that carry
// the whole booster moment are large-node joints (stronger and stiffer).
+PART[stationHub]:FINAL
{
	@name = TG_TowerHead
	@title = Catch Tower Head
	@rescaleFactor = 2.74
	@mass = 5
	%breakingForce = 1000
	%breakingTorque = 1000
	@crashTolerance = 50
	%entryCost = 0
	%cost = 0
	@node_stack_right = 0.9121535, 0, 0, 1, 0, 0, 3
	@node_stack_left = -0.9121535, 0, 0, -1, 0, 0, 3
	@node_stack_back = 0, 0, 0.9121535, 0, 0, 1, 3
	@node_stack_front = 0, 0, -0.9121535, 0, 0, -1, 3
	@node_stack_top = 0, 0.9121535, 0, 0, 1, 0, 4
	@node_stack_bottom = 0, -0.9121535, 0, 0, -1, 0, 4
}

// Arm hinge: the Breaking Ground G-32W with a much stronger motor. The stock 1200 cannot move
// the ~9 t, 15 m arms: 30 degrees took over 30 s with 10-17 degrees of overshoot, and more
// damping only slowed them down (ground test, 27/09/2026).
//
// The drive (ModuleRoboticServoHinge.OnModifyServo and BaseServo.ModifyServo, decompiled): the
// angular X drive of the moving part's joint has
//   positionSpring = motorOutput x driveSpringMutliplier
//   positionDamper = driveDampingMutliplier x maxMotorOutput x servoMotorSize x hingeDamping
//   maximumForce   = motorOutput,  motorOutput = servoMotorSize x maxMotorOutput x servoMotorLimit
// servoMotorLimit (the torque %) and hingeDamping are persistent and are written by the client that
// drives the arms, before every arm move. maxMotorOutput, the two multipliers and servoMass are
// config-only fields, never saved: a tower already in a save, or the shipped craft, takes this patch's
// values the next time the game loads.
//
// maxMotorOutput 20000 -> 80000 (with 20000 the arms took 6-10 s to close in flight, plus a slow
// second move). Ground tests (north tower active, nothing on the arms, 3 cycles per setting,
// maxMotorOutput and the multipliers written on the fly):
//   * the hinge is force-limited: the arm speed is set by the force cap (motorOutput), not by the
//     spring. Torque 100 % with spring and damper x3 (multipliers 300/60) moves exactly like torque
//     100 % alone: the multipliers do nothing and stay stock;
//   * the part's mass, which KSP recomputes from the motor in flight (GetModuleMass; read in game:
//     4.2 t at 20000, 8.2 t at 40000, 16.2 t at 80000), takes the overshoot away;
//   * 20000, torque 60 %, damping 400 % (12000 kN.m): first stop 4.6 s, overshoot +7-14 %, closed
//     in 7.7-7.8 s after 3 slow second moves; 40000, 50 %/200 % (20000 kN.m): 2.6 s, +5-8 %, closed
//     in 5.0 s after 3 second moves; 80000, 25 %/100 % (20000 kN.m): first stop 3.0 s, -1 to -2 %,
//     closed and locked in 3.24-3.28 s, no second move; 80000, 15 %/100 % (12000 kN.m): 4.7 s,
//     -1 to -3 %, 4.9 s, no second move. No sustained vibration after the lock (a 5 s watch after
//     each of the 42 moves).
// Kept: 80000, torque 25 %, damping 100 %, 10 deg/s. servoMass stays the stock 0.1 t (never tested).
//
// The force rule. The force cap (motorOutput = maxMotorOutput x torque %, counted at 100 % motor
// size) never exceeds 20000 kN.m, half of what breaks a hinge joint without KJR (min breakingTorque
// 200 x stackNodeFactor 2 x (node size 1 + 1) x jointBreakTorqueFactor 50 = 40000 kN.m, PartJoint,
// Physics.cfg; the joints_v1 probe reads 84104 kN.m with KJR): with this motor, torque <= 25 %.
// 60 % would give 48000 kN.m, 100 % 80000. A client that drives the arms should read maxMotorOutput
// on the hinges once the tower is found, use the settings measured for that motor, and not move the
// arms for any other motor. The module's defaults follow the rule too: torque 25 % and damping
// 100 % (servoMotorLimit and hingeDamping are persistent: a new part, the shipped craft, whose
// hinge nodes carry neither, and a tower posed by tower_spawn_v1 take these; a tower already in a
// save keeps what was saved there, 60 %/400 % or the stock 100 %/100 %, until the client writes its
// own before its first move: do not drive those hinges by hand).
// Power: 0.02 x motorOutput x rate / (180 x 0.75) EC/s, 2.96 EC per degree per hinge at 25 %
// (as at 100 % of the old motor).
//
// History of this setting. 80000 was suspended once and restored. The suspension: at each lock
// change of the hinges (BaseServo.ModifyLocked -> CycleAllAutoStrut, KJR rebuilding its joints, the
// tower then far from the floating origin) a hinge jumped 0.2-0.56 deg with the arm's tip still
// (0.07 deg at most with 20000), then an internal torque above the 20000 kN.m cap drove the arm
// against its stop. It was not the engine exhaust (nozzles 25 m above the rails at the lock, inside
// the slot at the close). The restoration: the tower is held to the world by this mod at any
// distance from the floating origin (conn.tower_site tower_ground_v1). Ground test in flight
// conditions (north tower not active, 3.2 km from the active vessel, loaded by the tower bubble):
// with the anchoring, 4 closings out of 4 in 3.40-4.02 s, no second move, no vibration, lock jump
// 0.014 deg; without it, the arm runs away at 25 % AND at 15 % torque (12000 kN.m). So a client
// should take the 80000 settings only under a confirmed anchoring, and not move the arms otherwise.
+PART[hinge_04]:FINAL
{
	@name = TG_TowerHinge
	@title = Catch Tower Arm Hinge
	%entryCost = 0
	%cost = 0
	@MODULE[ModuleRoboticServoHinge]
	{
		@maxMotorOutput = 80000
		%servoMotorLimit = 25
		%hingeDamping = 100
	}
}

// Tower v2, lattice mast from Modular Launch Pads (AlphaMensae), only if it is installed:
// the General Service Tower Large Core (5 m square, 11.3 m sections, arm nodes on one
// face). The originals weigh 0.05-0.4 t with a breakingForce of 500000: far too light to
// sit in the load path of a 22-225 t booster (mass ratios across joints), hence 8 t.
// Both copies default to the "Off" base subtype (bottom node raised to 1.3 m), so a craft
// needs no B9 settings. The ground base ("On", Base_Large: 1.3 m high, sloping out to
// ~15 m) reached under the booster at the capture point and would have taken its engine
// exhaust on the tower's root part: the base section stands on its lattice instead.
+PART[AM_MLP_GeneralTowerMulti]:FINAL
{
	@name = TG_TowerBase
	@title = Catch Tower Base Section (MLP)
	// Ballast: the arms put the tower's centre of mass 4.6 m out, beyond the 2.5 m half-width
	// of its base; only the clamps held it, and a tower that lost them leaned 4.4 degrees toward
	// the arms (29/09/2026). 160 t brings it back to ~1.6 m, inside the base.
	@mass = 160
	%entryCost = 0
	%cost = 0
	// Tower v5 look (30/09/2026): dark gray lattice, like the Starbase tower.
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitch]]
	{
		%currentSubtype = Dark Gray
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[baseSwitch]]
	{
		%currentSubtype = Off
	}
}

+PART[AM_MLP_GeneralTowerMulti]:FINAL
{
	@name = TG_TowerCore
	@title = Catch Tower Section (MLP)
	@mass = 8
	%entryCost = 0
	%cost = 0
	// Tower v5 look (30/09/2026): dark gray lattice, like the Starbase tower.
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitch]]
	{
		%currentSubtype = Dark Gray
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[baseSwitch]]
