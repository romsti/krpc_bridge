// Retractable catch pin (decision of 29/09/2026): the Breaking Ground 1P4 Telescoping
// Hydraulic Cylinder, hidden inside the tank (parts of one vessel do not collide with each
// other) and extended through the tank wall for the catch, then locked; its rod is the pin
// (0.6 m). Retracted it is 1.11 m long, its stroke is 2.4 m. Unlike the fixed pin, the
// booster's weight crosses two joints (tank <-> cylinder, the cylinder itself): stronger
// joints on the copy. KSP still counts the drag of a part hidden inside another one (only
